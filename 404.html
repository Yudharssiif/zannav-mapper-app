<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <script>
    // GitHub Pages & Subfolder Dynamic Base HREF Fallback
    // Automatically detects GitHub Pages subpath (e.g. /zannav-mapper-app/) if base href wasn't pre-set
    (function () {
      var base = document.querySelector('base');
      var href = base ? base.getAttribute('href') : '';
      if (!href || href === '/') {
        var path = window.location.pathname;
        if (window.location.hostname.endsWith('github.io')) {
          var segment = path.split('/')[1];
          if (segment && segment.length > 0) {
            base.setAttribute('href', '/' + segment + '/');
          }
        } else if (path !== '/' && path.lastIndexOf('/') > 0) {
          base.setAttribute('href', path.substring(0, path.lastIndexOf('/') + 1));
        }
      }
    })();
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="ZanNav Mapper - Community-powered public transit data collection for Zanzibar.">

  <!-- Mobile & PWA meta tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ZanNav Mapper">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- OpenGraph / Social Meta Tags -->
  <meta property="og:title" content="ZanNav Mapper">
  <meta property="og:description" content="Community-powered public transit data collection for Zanzibar.">
  <meta property="og:image" content="og.png">

  <!-- Theme Color -->
  <meta name="theme-color" content="#4F46E5">
  <meta name="msapplication-navbutton-color" content="#4F46E5">

  <!-- Favicons -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ZanNav Mapper • Zanzibar Transit Survey</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #0F172A;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #loading-container {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 30%, #1E293B 0%, #0F172A 100%);
      z-index: 99999;
      transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
    }

    .loader-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px;
      max-width: 320px;
    }

    .app-icon {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.4);
      margin-bottom: 20px;
      animation: pulse 2s infinite ease-in-out;
    }

    .app-title {
      color: #F8FAFC;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin: 0 0 6px 0;
    }

    .app-subtitle {
      color: #94A3B8;
      font-size: 13px;
      font-weight: 400;
      margin: 0 0 24px 0;
    }

    .spinner-ring {
      display: inline-block;
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: #4F46E5;
      animation: spin 0.8s linear infinite;
    }

    .loading-hint {
      color: #64748B;
      font-size: 12px;
      margin-top: 14px;
      letter-spacing: 0.2px;
    }

    #troubleshoot-btn {
      display: none;
      margin-top: 18px;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: #CBD5E1;
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    #troubleshoot-btn:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="loader-card">
      <img src="apple-touch-icon.png" alt="ZanNav Logo" class="app-icon" onerror="this.style.display='none'">
      <h1 class="app-title">ZanNav Mapper</h1>
      <p class="app-subtitle">Zanzibar Transit Field Survey</p>
      <div class="spinner-ring"></div>
      <p class="loading-hint" id="loading-status">Initializing survey tools...</p>
      <button id="troubleshoot-btn" onclick="clearCacheAndReload()">Taking too long? Clear Cache & Reload</button>
    </div>
  </div>

  <script>
    // Show troubleshooting option if loading takes more than 10 seconds
    var timer = setTimeout(function() {
      var btn = document.getElementById('troubleshoot-btn');
      var status = document.getElementById('loading-status');
      if (btn) btn.style.display = 'inline-block';
      if (status) status.innerText = 'Connecting to transit database...';
    }, 10000);

    function clearCacheAndReload() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var registration of registrations) {
            registration.unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var name of names) {
            caches.delete(name);
          }
        });
      }
      window.location.reload(true);
    }

    // Dismiss loader when Flutter renders its first frame
    window.addEventListener('flutter-first-frame', function () {
      clearTimeout(timer);
      var container = document.getElementById('loading-container');
      if (container) {
        container.style.opacity = '0';
        container.style.visibility = 'hidden';
        setTimeout(function() { container.remove(); }, 500);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
