name: Deploy ZanNav Mapper to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inspect Workspace Directory
        run: |
          echo "Current directory: $(pwd)"
          ls -la

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.2'

      - name: Get Dependencies
        run: flutter pub get

      - name: Create .env (required asset)
        run: echo "NEON_DATABASE_URL=${{ secrets.NEON_DATABASE_URL }}" > .env

      - name: Build Flutter Web
        run: |
          flutter build web --release \
            --base-href /${{ github.event.repository.name }}/ \
            --dart-define=NEON_DATABASE_URL="${{ secrets.NEON_DATABASE_URL }}"

      - name: Sync SPA 404 fallback with built index.html
        run: cp build/web/index.html build/web/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
